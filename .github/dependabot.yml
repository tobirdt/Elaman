version: 2

updates:
  # Application dependencies. Minor and patch updates are batched into two pull
  # requests so routine maintenance stays reviewable; majors arrive separately
  # because they need their own regression pass.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # eslint-config-next pins typescript-eslint and eslint-plugin-react,
      # which do not support these majors yet. Lift once Next ships support.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
    groups:
      npm-minor:
        update-types:
          - minor
      npm-patch:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-minor:
        update-types:
          - minor
      actions-patch:
        update-types:
          - patch
